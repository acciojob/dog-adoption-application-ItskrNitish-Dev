<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<h1>Dog Adoption Application Form</h1>

    <form id="adoptionForm" action="/submit" method="POST">

        <!-- Name -->
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Name"
        >

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Phone Number"
        >

        <input
            type="text"
            id="address"
            name="address"
            placeholder="Address"
        >

        <label for="checkbox">
            <input
                type="checkbox"
                id="checkbox"
                name="checkbox"
                value="Have you ever lived with a Dog before?"
            >
            Have you ever lived with a Dog before?
        </label>

        <label for="multiSelect">
            Please select your preferred breeds
        </label>

        <select
            id="multiSelect"
            name="multiSelect"
            multiple
        >
            <option value="Labrador">Labrador</option>
            <option value="German Shepherd">German Shepherd</option>
            <option value="Golden Retriever">Golden Retriever</option>
            <option value="Pug">Pug</option>
            <option value="Beagle">Beagle</option>
        </select>

        <input
            type="submit"
            id="submit"
            value="Submit"
        >

    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
